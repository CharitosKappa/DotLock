[workspace]
resolver = "2"
members = [
    "core/dotlock-crypto",
    "core/dotlock-format",
    "core/dotlock-store",
    "core/dotlock-sync",
    "core/dotlock-ffi",
    "core/test-vectors",
    "server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
